<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="description" content="Smart Grow Laboratory - Pusat Riset IoT, AI, & Smart Agriculture Telkom University. Platform manajemen magang riset & monitoring greenhouse otomatis." />
    <meta name="theme-color" content="#355E3B" />
    <link rel="icon" type="image/png" href="/images/smart-grow-logo.png" />
    <link rel="apple-touch-icon" href="/images/smart-grow-logo.png" />
    <title>Smart Grow Laboratory | Telkom University Research Center</title>
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('Failed to fetch dynamically imported module') > -1 || e.message.indexOf('Loading chunk') > -1)) {
          var k = 'smartgrow_chunk_reload';
          var l = localStorage.getItem(k);
          if (!l || Date.now() - parseInt(l) > 10000) {
            localStorage.setItem(k, Date.now().toString());
            window.location.reload(true);
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
